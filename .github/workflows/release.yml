name: Release

# Tagging v* builds signed desktop bundles and publishes them as a GitHub
# Release. macOS builds are signed + notarized when the APPLE_* secrets are
# present; without them the build still succeeds and produces an unsigned
# bundle, so the pipeline is usable before the Apple Developer enrolment
# completes. See docs/CODE-SIGNING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0); created at the chosen branch's head if it doesn't exist"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            label: macOS (Universal)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows (x64)

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    steps:
      # Build the commit the run was started on: the tag for a tag push, or
      # the chosen branch for a manual run. tauri-action creates the tag at
      # this commit when it doesn't exist yet, so a release can be cut from
      # the Actions tab without pushing a tag first.
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization. Absent → unsigned bundle, build still
          # succeeds. tauri-action skips signing when these are unset.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Track2Mix ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Download the build for your platform below.

            **macOS:** open the `.dmg` and drag Track2Mix to Applications.
            **Windows:** run the `.msi` installer.

            Installation notes and troubleshooting: [docs/INSTALL.md](https://github.com/astralisone/selecta/blob/main/docs/INSTALL.md)
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}
